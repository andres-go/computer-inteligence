<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>Sentiment Analysis</h1>
        <form id="sentiment-form">
            <textarea id="input-text" placeholder="Enter text to analyze..." required></textarea>
            <button type="submit">Analyze</button>
        </form>
        <div id="result">
            <img id="result-gif" src="" alt="sentiment gif" />
            <div id="result-label"></div>
            <div id="result-probability"></div>
            <button id="reset-btn" type="button">Try Again</button>
        </div>
    </div>
    <script src="/main.js"></script>
</body>
</html>
